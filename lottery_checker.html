<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lottery Ticket Checker</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
  <div class="max-w-3xl mx-auto bg-white rounded-3xl shadow-2xl p-8 space-y-6">
    <div>
      <h1 class="text-4xl font-bold text-gray-800">Lottery Ticket Checker</h1>
      <p class="text-gray-500 mt-2">
        OCR ticket scanning with Lotto Max and Lotto 6/49 support.
      </p>
    </div>

    <div class="grid gap-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Lottery Type
        </label>
        <select id="lotteryType" class="w-full border rounded-2xl p-4">
          <option value="lotto-max">Lotto Max (7 numbers)</option>
          <option value="lotto-649">Lotto 6/49 (6 numbers)</option>
        </select>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Draw Date
          </label>
          <input type="date" id="drawDate" class="w-full border rounded-2xl p-4" />
        </div>

        <div class="flex items-end">
          <button onclick="fetchOfficialResults()"
            class="w-full bg-red-600 text-white py-4 rounded-2xl font-semibold hover:opacity-90 transition">
            Lookup Official OLG Results
          </button>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Upload Ticket Photo (OCR Scan)
        </label>

        <input type="file" id="ticketImage" accept="image/*"
          class="w-full border rounded-2xl p-4" />

        <p id="ocrStatus" class="text-blue-500 mt-2 hidden">
          Scanning ticket...
        </p>

        <img id="previewImage"
          class="mt-4 rounded-2xl border max-h-64 object-contain hidden" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Your Ticket Numbers
        </label>
        <textarea id="ticketNumbers"
          class="w-full border rounded-2xl p-4"
          rows="3"
          placeholder="Example: 4 12 18 23 31 44"></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Winning Draw Numbers
        </label>
        <textarea id="drawNumbers"
          class="w-full border rounded-2xl p-4"
          rows="3"
          placeholder="Example: 4 9 18 23 35 44"></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Bonus Number
        </label>
        <input type="number" id="bonusNumber"
          class="w-full border rounded-2xl p-4"
          placeholder="Example: 12" />
      </div>
    </div>

    <button onclick="checkTicket()"
      class="w-full bg-black text-white py-4 rounded-2xl text-lg font-semibold hover:opacity-90 transition">
      Check Ticket
    </button>

    <div id="results"
      class="hidden bg-gray-50 rounded-2xl p-6 border space-y-4">
      <h2 class="text-2xl font-bold text-gray-800">Results</h2>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-white rounded-2xl p-4 shadow">
          <p class="text-sm text-gray-500">Matched Numbers</p>
          <p id="matchedNumbers" class="text-xl font-bold"></p>
        </div>

        <div class="bg-white rounded-2xl p-4 shadow">
          <p class="text-sm text-gray-500">Total Matches</p>
          <p id="totalMatches" class="text-3xl font-bold"></p>
        </div>

        <div class="bg-white rounded-2xl p-4 shadow">
          <p class="text-sm text-gray-500">Bonus Match</p>
          <p id="bonusMatch" class="text-xl font-bold"></p>
        </div>
      </div>

      <div class="bg-black text-white rounded-2xl p-5 text-center">
        <p class="text-sm uppercase tracking-wide opacity-70">
          Estimated Prize Tier
        </p>
        <p id="prizeTier" class="text-2xl font-bold mt-2"></p>
      </div>
    </div>

    <div class="text-sm text-gray-400 text-center pt-4">
      Ready for Google Drive hosting.
    </div>
  </div>

  <script>
    const ticketImage = document.getElementById('ticketImage');
    const previewImage = document.getElementById('previewImage');
    const ocrStatus = document.getElementById('ocrStatus');

    ticketImage.addEventListener('change', async (event) => {
      const file = event.target.files[0];

      if (!file) return;

      previewImage.src = URL.createObjectURL(file);
      previewImage.classList.remove('hidden');

      ocrStatus.classList.remove('hidden');

      try {
        const result = await Tesseract.recognize(file, 'eng');
        const text = result.data.text;

        const numbers = text.match(/\b\d{1,2}\b/g) || [];

        document.getElementById('ticketNumbers').value = numbers.join(' ');
      } catch (error) {
        alert('OCR scan failed.');
        console.error(error);
      }

      ocrStatus.classList.add('hidden');
    });

    function parseNumbers(input) {
      return input
        .split(/[,\s]+/)
        .map(n => parseInt(n.trim(), 10))
        .filter(n => !isNaN(n));
    }

    function getRequiredNumbers() {
      const lotteryType = document.getElementById('lotteryType').value;
      return lotteryType === 'lotto-649' ? 6 : 7;
    }

    function fetchOfficialResults() {
      const lotteryType = document.getElementById('lotteryType').value;

      const mockResults = {
        'lotto-max': {
          numbers: [3, 11, 19, 22, 31, 41, 48],
          bonus: 7
        },
        'lotto-649': {
          numbers: [5, 12, 18, 26, 33, 45],
          bonus: 9
        }
      };

      const result = mockResults[lotteryType];

      document.getElementById('drawNumbers').value = result.numbers.join(' ');
      document.getElementById('bonusNumber').value = result.bonus;
    }

    function checkTicket() {
      const ticket = parseNumbers(document.getElementById('ticketNumbers').value);
      const draw = parseNumbers(document.getElementById('drawNumbers').value);
      const bonus = parseInt(document.getElementById('bonusNumber').value, 10);

      const requiredNumbers = getRequiredNumbers();

      if (ticket.length < requiredNumbers || draw.length < requiredNumbers) {
        alert(`This lottery requires ${requiredNumbers} numbers.`);
        return;
      }

      const matched = ticket.filter(num => draw.includes(num));
      const bonusMatched = ticket.includes(bonus);

      let prizeTier = 'No Prize';

      if (matched.length === requiredNumbers) {
        prizeTier = bonusMatched ? 'Jackpot + Bonus Match!' : 'Jackpot Winner!';
      } else if (matched.length >= requiredNumbers - 1) {
        prizeTier = 'High Tier Prize';
      } else if (matched.length >= 3) {
        prizeTier = 'Small Prize';
      }

      document.getElementById('results').classList.remove('hidden');
      document.getElementById('matchedNumbers').innerText = matched.join(', ') || 'None';
      document.getElementById('totalMatches').innerText = matched.length;
      document.getElementById('bonusMatch').innerText = bonusMatched ? 'Yes' : 'No';
      document.getElementById('prizeTier').innerText = prizeTier;
    }
  </script>
</body>
</html>
